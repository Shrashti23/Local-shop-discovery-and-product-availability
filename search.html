<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Products | NearShop Karnataka</title>
<meta name="description" content="Check product availability and prices at local shops across Karnataka before you visit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<div id="ns-nav"></div>
<main class="container py-4" id="main">

<h1 class="h4 mb-3" data-i18n="nav_search"></h1>
<form id="f" class="card p-3 mb-3" role="search"><div class="row g-2">
  <div class="col-12 col-md-4"><label class="form-label small" for="q" data-i18n="nav_search"></label>
    <input id="q" class="form-control" maxlength="60" data-i18n-ph="search_ph" autocomplete="off"></div>
  <div class="col-6 col-md-2"><label class="form-label small" for="city" data-i18n="city"></label><select id="city" class="form-select"></select></div>
  <div class="col-6 col-md-2"><label class="form-label small" for="pin" data-i18n="pincode"></label>
    <input id="pin" class="form-control" inputmode="numeric" maxlength="6" placeholder="560001"></div>
  <div class="col-6 col-md-2"><label class="form-label small" for="cat" data-i18n="category"></label><select id="cat" class="form-select"></select></div>
  <div class="col-6 col-md-2"><label class="form-label small" for="max" data-i18n="max_price"></label>
    <input id="max" type="number" min="1" step="1" class="form-control"></div>
  <div class="col-6 col-md-3"><label class="form-label small" for="sort" data-i18n="sort"></label>
    <select id="sort" class="form-select"><option value="price" data-i18n="sort_price"></option>
    <option value="distance" data-i18n="sort_distance"></option><option value="updated" data-i18n="sort_updated"></option></select></div>
  <div class="col-6 col-md-3 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" id="stock" checked>
    <label class="form-check-label" for="stock" data-i18n="in_stock_only"></label></div></div>
  <div class="col-6 col-md-3 d-grid align-items-end"><button type="button" class="btn btn-outline-ns" id="loc">&#128205; <span data-i18n="use_location"></span></button></div>
  <div class="col-6 col-md-3 d-grid align-items-end"><button class="btn btn-ns" data-i18n="search_btn"></button></div>
</div></form>
<div id="msg"></div><div id="count" class="small text-muted mb-2"></div><div id="out"></div>
</main>
<div id="ns-footer"></div>
<script src="bootstrap.bundle.min.js"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>

(async function () {
  var ctx = await NS.init({ active: 'search' });
  var cats = [], pos = null, last = [], seq = 0;
  var $ = function (id) { return document.getElementById(id); };
  function fillSelects() {
    NS.fillCitySelect($('city')); NS.fillCategorySelect($('cat'), cats);
  }
  cats = await NS.loadCategories(); fillSelects();
  $('q').value = NS.safeTerm(NS.param('q'));
  $('city').value = NS.CITIES.indexOf(NS.param('city')) >= 0 ? NS.param('city') : '';
  $('cat').value = /^[0-9]+$/.test(NS.param('cat')) ? NS.param('cat') : '';
  if (/^[0-9]{6}$/.test(NS.param('pin'))) $('pin').value = NS.param('pin');

  function render() {
    var rows = last.slice();
    var s = $('sort').value;
    if (s === 'distance' && pos) {
      rows.sort(function (a, b) {
        var da = NS.distKm(pos, a.shops), db = NS.distKm(pos, b.shops);
        return (da === null ? 1e9 : da) - (db === null ? 1e9 : db);
      });
    } else if (s === 'updated') {
      rows.sort(function (a, b) { return new Date(b.last_updated) - new Date(a.last_updated); });
    }
    // lowest price per product among in-stock, fresh-enough listings
    var low = {};
    rows.forEach(function (r) {
      if (r.quantity > 0 && NS.freshness(r.last_updated) !== 'unverified') {
        if (low[r.product_id] === undefined || Number(r.price) < low[r.product_id]) low[r.product_id] = Number(r.price);
      }
    });
    var count = {};
    rows.forEach(function (r) { count[r.product_id] = (count[r.product_id] || 0) + 1; });
    $('count').textContent = rows.length + ' ' + NS.t('results');
    $('out').innerHTML = rows.length ? rows.map(function (r) {
      var isLow = count[r.product_id] > 1 && r.quantity > 0 && Number(r.price) === low[r.product_id];
      return NS.resultCard(r, { pos: pos, lowest: isLow });
    }).join('') : '<div class="card p-4 text-center"><div class="fw-semibold">' + NS.esc(NS.t('no_results')) + '</div><div class="text-muted small">' +
      NS.esc(NS.t('no_results_hint')) + '</div></div>';
  }

  async function run() {
    var my = ++seq;
    $('msg').innerHTML = '';
    var pin = $('pin').value.trim();
    if (pin && !NS.validPin(pin)) return NS.flash($('msg'), 'warning', 'Enter a valid 6-digit Karnataka PIN code (560001 - 591999).');
    var mp = parseFloat($('max').value);
    $('out').innerHTML = '<div class="skeleton">' + NS.esc(NS.t('loading')) + '</div>';
    var o = { q: $('q').value, city: $('city').value, pincode: pin, categoryId: $('cat').value ? Number($('cat').value) : null,
      maxPrice: mp > 0 ? mp : null, inStock: $('stock').checked };
    var r = await NS.searchInventory(o);
    if (my !== seq) return; // a newer search superseded this one
    if (r.error) { $('out').innerHTML = ''; return NS.flash($('msg'), 'danger', NS.errMsg(r.error)); }
    last = r.data || [];
    var p = new URLSearchParams();
    if (o.q) p.set('q', o.q); if (o.city) p.set('city', o.city); if (o.categoryId) p.set('cat', o.categoryId); if (pin) p.set('pin', pin);
    history.replaceState(null, '', 'search.html' + (p.toString() ? '?' + p.toString() : ''));
    render();
  }
  $('f').addEventListener('submit', function (e) { e.preventDefault(); run(); });
  ['city', 'cat', 'stock'].forEach(function (id) { $(id).addEventListener('change', run); });
  $('sort').addEventListener('change', render);
  $('loc').addEventListener('click', async function () {
    try { pos = await NS.getPos(); $('sort').value = 'distance'; render(); }
    catch (e) { NS.flash($('msg'), 'warning', 'Could not get your location. Allow location access in the browser, or search by city / PIN code.'); }
  });
  NS.onLang(function () { fillSelects(); if (last) render(); });
  run();
})();

</script>
</body>
</html>
