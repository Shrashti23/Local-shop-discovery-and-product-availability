<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product | NearShop Karnataka</title>
<meta name="description" content="Check product availability and prices at local shops across Karnataka before you visit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<div id="ns-nav"></div>
<main class="container py-4" id="main">

<div id="msg"></div>
<div id="head" class="card p-3 mb-3 skeleton" data-i18n="loading"></div>
<h2 class="h5" data-i18n="where_to_buy"></h2><div id="out"></div>
</main>
<div id="ns-footer"></div>
<script src="bootstrap.bundle.min.js"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>

(async function () {
  var ctx = await NS.init({ active: 'search' });
  var id = NS.param('id'), pos = null, rows = [];
  var $ = function (i) { return document.getElementById(i); };
  if (!NS.isUuid(id)) { $('head').remove(); return NS.flash($('msg'), 'danger', 'Invalid product link.'); }
  var pr = await NS.sb.from('products').select('id,name,brand,variant,description,image_url,categories(name,name_kn)').eq('id', id).maybeSingle();
  if (pr.error || !pr.data) { $('head').remove(); return NS.flash($('msg'), 'warning', 'Product not found.'); }
  var p = pr.data;
  function drawHead() {
    var h = $('head'); h.classList.remove('skeleton');
    h.innerHTML = '<div class="d-flex gap-3"><img class="prod-img" style="width:96px;height:96px" alt="" src="' + NS.esc(NS.imgSrc(p.image_url)) + '">' +
      '<div><h1 class="h4 mb-1">' + NS.esc(p.name) + (p.variant ? ' <small class="text-muted">(' + NS.esc(p.variant) + ')</small>' : '') + '</h1>' +
      '<div class="text-muted">' + NS.esc(p.brand || '') + (p.categories ? ' &middot; ' + NS.esc(NS.catName(p.categories)) : '') + '</div>' +
      (p.description ? '<p class="mb-0 mt-2">' + NS.esc(p.description) + '</p>' : '') + '</div></div>' +
      '<div class="mt-3"><button class="btn btn-sm btn-outline-ns" id="loc">&#128205; ' + NS.esc(NS.t('use_location')) + '</button></div>';
    $('loc').addEventListener('click', async function () {
      try { pos = await NS.getPos(); draw(); } catch (e) { NS.flash($('msg'), 'warning', 'Could not get your location.'); }
    });
  }
  function draw() {
    var list = rows.slice();
    if (pos) list.sort(function (a, b) { var x = NS.distKm(pos, a.shops), y = NS.distKm(pos, b.shops); return (x === null ? 1e9 : x) - (y === null ? 1e9 : y); });
    var low = null;
    list.forEach(function (r) { if (r.quantity > 0 && NS.freshness(r.last_updated) !== 'unverified' && (low === null || Number(r.price) < low)) low = Number(r.price); });
    $('out').innerHTML = list.length ? list.map(function (r) {
      return NS.resultCard(r, { pos: pos, lowest: list.length > 1 && r.quantity > 0 && Number(r.price) === low });
    }).join('') : '<div class="card p-4 text-center"><div class="fw-semibold">No shop has published a confirmed listing for this product yet.</div><div class="small text-muted mt-1">This is a catalogue entry. Ask a shop owner to add the price and stock from Manage Products.</div></div>';
  }
  drawHead();
  var r = await NS.searchInventory({ productId: id });
  if (r.error) NS.flash($('msg'), 'danger', NS.errMsg(r.error));
  rows = r.data || []; draw();
  NS.onLang(function () { drawHead(); draw(); });
})();

</script>
</body>
</html>
