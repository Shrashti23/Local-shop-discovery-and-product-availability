<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home | NearShop Karnataka</title>
<meta name="description" content="Check product availability and prices at local shops across Karnataka before you visit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<div id="ns-nav"></div>
<main class="container py-4" id="main">

<section class="hero p-4 p-md-5 mb-4">
  <h1 class="fw-bold" data-i18n="hero_title">Check product availability before you visit local shops</h1>
  <p class="lead mb-4" data-i18n="hero_sub"></p>
  <form id="heroForm" class="row g-2" role="search">
    <div class="col-12 col-md-5"><label class="visually-hidden" for="q" data-i18n="nav_search"></label>
      <input id="q" class="form-control form-control-lg" maxlength="60" data-i18n-ph="search_ph" autocomplete="off"></div>
    <div class="col-6 col-md-3"><label class="visually-hidden" for="city" data-i18n="city"></label>
      <select id="city" class="form-select form-select-lg"></select></div>
    <div class="col-6 col-md-2"><label class="visually-hidden" for="cat" data-i18n="category"></label>
      <select id="cat" class="form-select form-select-lg"></select></div>
    <div class="col-12 col-md-2 d-grid"><button class="btn btn-warning btn-lg fw-semibold" data-i18n="search">Search</button></div>
  </form>
</section>

<section class="mb-4"><h2 class="h5 mb-3" data-i18n="categories"></h2><div class="row g-2" id="cats"></div></section>

<section class="mb-4"><div class="d-flex justify-content-between align-items-center mb-2">
  <h2 class="h5 mb-0" data-i18n="featured"></h2><a href="search.html" data-i18n="view_all"></a></div>
  <div id="featured" class="skeleton" data-i18n="loading"></div></section>

<section class="mb-4"><div class="d-flex justify-content-between align-items-center mb-2">
  <h2 class="h5 mb-0" data-i18n="verified_shops"></h2><a href="shops.html" data-i18n="view_all"></a></div>
  <div class="row g-3" id="shopsBox"></div></section>

<section class="mb-4"><h2 class="h5 mb-3" data-i18n="how_title"></h2><div class="row g-3 text-center">
  <div class="col-md-4"><div class="card p-3"><div class="fs-2">&#128269;</div><div data-i18n="how1"></div></div></div>
  <div class="col-md-4"><div class="card p-3"><div class="fs-2">&#9878;&#65039;</div><div data-i18n="how2"></div></div></div>
  <div class="col-md-4"><div class="card p-3"><div class="fs-2">&#128222;</div><div data-i18n="how3"></div></div></div></div></section>

<section class="card p-4 text-center"><h2 class="h5" data-i18n="cta_title"></h2><p data-i18n="cta_text"></p>
  <div><a class="btn btn-ns" href="shop-register.html" data-i18n="register_shop"></a></div></section>
</main>
<div id="ns-footer"></div>
<script src="bootstrap.bundle.min.js"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>

(async function () {
  var ctx = await NS.init({ active: 'home' });
  var cats = [];
  function drawCats() {
    NS.fillCitySelect(document.getElementById('city'));
    NS.fillCategorySelect(document.getElementById('cat'), cats);
    document.getElementById('cats').innerHTML = cats.map(function (c) {
      return '<div class="col-6 col-md-2"><a class="card cat-tile card-hover" href="search.html?cat=' + NS.esc(c.id) + '">' +
        '<div class="ico">' + NS.esc(c.icon) + '</div><div class="small fw-semibold">' + NS.esc(NS.catName(c)) + '</div></a></div>';
    }).join('');
  }
  async function drawLists() {
    var r = await NS.sb.from('shop_inventory').select(NS.INV_SELECT).eq('shops.verification_status', 'approved')
      .gt('quantity', 0).order('last_updated', { ascending: false }).limit(6);
    var box = document.getElementById('featured');
    box.classList.remove('skeleton');
    if (r.error) box.innerHTML = NS.alert('danger', NS.errMsg(r.error));
    else if (!r.data.length) box.innerHTML = '<div class="text-muted">' + NS.esc(NS.t('no_results')) + '</div>';
    else box.innerHTML = r.data.map(function (it) { return NS.resultCard(it); }).join('');
    var s = await NS.sb.from('shops').select('id,owner_id,shop_name,city,category_focus,address')
      .eq('verification_status', 'approved').order('verified_at', { ascending: false }).limit(6);
    document.getElementById('shopsBox').innerHTML = (s.data || []).map(function (x) {
      return '<div class="col-md-4"><a class="card card-hover p-3 text-decoration-none h-100" href="shop-details.html?id=' + NS.esc(x.id) + '">' +
        '<div class="fw-semibold">' + NS.esc(x.shop_name) + ' <span class="badge ' + (x.owner_id ? 'bg-success' : 'bg-secondary') + '">' + (x.owner_id ? 'Owner verified' : 'Public listing') + '</span></div>' +
        '<div class="small text-muted">' + NS.esc(x.category_focus || '') + '</div>' +
        '<div class="small">' + NS.esc(x.address) + ', ' + NS.esc(x.city) + '</div></a></div>';
    }).join('');
  }
  cats = await NS.loadCategories();
  drawCats();
  drawLists();
  NS.onLang(function () { drawCats(); drawLists(); });
  document.getElementById('heroForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var p = new URLSearchParams();
    var q = document.getElementById('q').value.trim(), c = document.getElementById('city').value, k = document.getElementById('cat').value;
    if (q) p.set('q', q); if (c) p.set('city', c); if (k) p.set('cat', k);
    location.href = 'search.html' + (p.toString() ? '?' + p.toString() : '');
  });
})();

</script>
</body>
</html>
