<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Login | NearShop Karnataka</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="visually-hidden-focusable" href="#main">Skip to content</a>
<div id="ns-nav"></div>
<main class="container py-4" id="main">

<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<div class="card p-4">
  <h1 class="h4 mb-3" data-i18n="login_title"></h1>
  <ul class="nav nav-pills mb-3" id="roleTabs">
    <li class="nav-item"><a class="nav-link" href="login.html?role=customer" data-role="customer" data-i18n="role_customer"></a></li>
    <li class="nav-item"><a class="nav-link" href="login.html?role=shop_owner" data-role="shop_owner" data-i18n="role_shop"></a></li>
    <li class="nav-item"><a class="nav-link" href="login.html?role=admin" data-role="admin" data-i18n="role_admin"></a></li>
  </ul>
  <div id="msg"></div>
  <form id="f" novalidate>
    <div class="mb-3"><label class="form-label" for="email" data-i18n="email"></label><input id="email" type="email" class="form-control" autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label" for="pw" data-i18n="password"></label><input id="pw" type="password" class="form-control" autocomplete="current-password" required></div>
    <div class="d-grid"><button class="btn btn-ns" id="btn" data-i18n="login_btn"></button></div>
  </form>
  <div class="mt-3 small" id="alt"></div>
</div></div></div>
</main>
<div id="ns-footer"></div>
<script src="bootstrap.bundle.min.js"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>

(async function () {
  var ctx = await NS.init({ active: 'login' });
  var $ = function (i) { return document.getElementById(i); };
  var role = ['customer', 'shop_owner', 'admin'].indexOf(NS.param('role')) >= 0 ? NS.param('role') : 'customer';
  var next = NS.safeNext(NS.param('next'));
  document.querySelectorAll('#roleTabs a').forEach(function (a) { if (a.getAttribute('data-role') === role) a.classList.add('active'); });
  function alt() {
    $('alt').innerHTML = role === 'customer' ? NS.esc(NS.t('no_account')) + ' <a href="customer-register.html">' + NS.esc(NS.t('nav_signup')) + '</a>' :
      role === 'shop_owner' ? NS.esc(NS.t('no_account')) + ' <a href="shop-register.html">' + NS.esc(NS.t('register_shop')) + '</a>' : '';
  }
  alt(); NS.onLang(alt);
  if (ctx && ctx.profile) { location.replace(next || NS.dashboardFor(ctx.profile.role)); return; }
  $('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var email = $('email').value.trim(), pw = $('pw').value;
    if (!NS.validEmail(email) || !pw) return NS.flash($('msg'), 'warning', 'Enter your email and password.');
    $('btn').disabled = true;
    var r = await NS.sb.auth.signInWithPassword({ email: email, password: pw });
    if (r.error) {
      $('btn').disabled = false;
      var m = /confirm/i.test(r.error.message) ? 'Please confirm your email first (check your inbox).' : 'Invalid email or password.';
      return NS.flash($('msg'), 'danger', m);
    }
    var p = await NS.sb.from('profiles').select('role').eq('id', r.data.user.id).maybeSingle();
    var actual = p.data && p.data.role;
    if (!actual) { await NS.sb.auth.signOut(); $('btn').disabled = false; return NS.flash($('msg'), 'danger', 'Account profile not found.'); }
    if (role === 'admin' && actual !== 'admin') {
      await NS.sb.auth.signOut(); $('btn').disabled = false; return NS.flash($('msg'), 'danger', NS.t('access_denied'));
    }
    location.href = next || NS.dashboardFor(actual);
  });
})();

</script>
</body>
</html>
